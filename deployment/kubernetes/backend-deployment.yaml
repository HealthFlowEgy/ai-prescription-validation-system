apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthflow-backend-blue
  namespace: healthflow-production
  labels:
    app: healthflow-backend
    color: blue
    version: v2.0.0
    component: backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: healthflow-backend
      color: blue
  template:
    metadata:
      labels:
        app: healthflow-backend
        color: blue
        version: v2.0.0
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: healthflow-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: healthflow-backend
        image: ghcr.io/healthflowezy/ai-prescription-validation-system:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
          protocol: TCP
        env:
        - name: FLASK_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: healthflow-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: healthflow-secrets
              key: redis-url
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: healthflow-secrets
              key: secret-key
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: healthflow-secrets
              key: jwt-secret-key
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: healthflow-secrets
              key: encryption-key
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: healthflow-secrets
              key: openai-api-key
        - name: FHIR_SERVER_URL
          valueFrom:
            configMapKeyRef:
              name: healthflow-config
              key: fhir-server-url
        - name: CORS_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: healthflow-config
              key: cors-origins
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 5000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        volumeMounts:
        - name: uploads
          mountPath: /app/uploads
        - name: logs
          mountPath: /app/logs
        - name: config
          mountPath: /app/config/production.py
          subPath: production.py
          readOnly: true
      volumes:
      - name: uploads
        persistentVolumeClaim:
          claimName: healthflow-uploads-pvc
      - name: logs
        persistentVolumeClaim:
          claimName: healthflow-logs-pvc
      - name: config
        configMap:
          name: healthflow-config
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - healthflow-backend
              topologyKey: kubernetes.io/hostname
      tolerations:
      - key: "healthflow.egypt.gov/dedicated"
        operator: "Equal"
        value: "backend"
        effect: "NoSchedule"
---
