apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthflow-celery-worker
  namespace: healthflow-production
  labels:
    app: healthflow-celery-worker
    version: v2.0.0
    component: worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: healthflow-celery-worker
  template:
    metadata:
      labels:
        app: healthflow-celery-worker
        version: v2.0.0
        component: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9540"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: healthflow-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: celery-worker
        image: ghcr.io/healthflowezy/ai-prescription-validation-system:latest
        imagePullPolicy: Always
        command: ["celery"]
        args: ["-A", "src.main.celery", "worker", "--loglevel=info", "--concurrency=4"]
        env:
        - name: FLASK_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: healthflow-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: healthflow-secrets
              key: redis-url
        - name: CELERY_BROKER_URL
          valueFrom:
            secretKeyRef:
              name: healthflow-secrets
              key: celery-broker-url
        - name: CELERY_RESULT_BACKEND
          valueFrom:
            secretKeyRef:
              name: healthflow-secrets
              key: celery-result-backend
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: healthflow-secrets
              key: secret-key
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: healthflow-secrets
              key: encryption-key
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: healthflow-secrets
              key: openai-api-key
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        livenessProbe:
          exec:
            command:
            - celery
            - -A
            - src.main.celery
            - inspect
            - ping
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        volumeMounts:
        - name: uploads
          mountPath: /app/uploads
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: uploads
        persistentVolumeClaim:
          claimName: healthflow-uploads-pvc
      - name: logs
        persistentVolumeClaim:
          claimName: healthflow-logs-pvc
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - healthflow-celery-worker
              topologyKey: kubernetes.io/hostname
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthflow-celery-beat
  namespace: healthflow-production
  labels:
    app: healthflow-celery-beat
    version: v2.0.0
    component: scheduler
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: healthflow-celery-beat
  template:
    metadata:
      labels:
        app: healthflow-celery-beat
        version: v2.0.0
        component: scheduler
    spec:
      serviceAccountName: healthflow-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: celery-beat
        image: ghcr.io/healthflowezy/ai-prescription-validation-system:latest
        imagePullPolicy: Always
        command: ["celery"]
        args: ["-A", "src.main.celery", "beat", "--loglevel=info"]
        env:
        - name: FLASK_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: healthflow-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: healthflow-secrets
              key: redis-url
        - name: CELERY_BROKER_URL
          valueFrom:
            secretKeyRef:
              name: healthflow-secrets
              key: celery-broker-url
        - name: CELERY_RESULT_BACKEND
          valueFrom:
            secretKeyRef:
              name: healthflow-secrets
              key: celery-result-backend
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: healthflow-secrets
              key: secret-key
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "100m"
        volumeMounts:
        - name: logs
          mountPath: /app/logs
        - name: celery-beat-schedule
          mountPath: /app/celerybeat-schedule
      volumes:
      - name: logs
        persistentVolumeClaim:
          claimName: healthflow-logs-pvc
      - name: celery-beat-schedule
        persistentVolumeClaim:
          claimName: healthflow-celery-beat-pvc

