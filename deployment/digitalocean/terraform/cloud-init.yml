#cloud-config

# Cloud-init configuration for Prescription Validation System
# This script runs when the droplet is first created

package_update: true
package_upgrade: true

packages:
  - curl
  - wget
  - git
  - unzip
  - software-properties-common
  - apt-transport-https
  - ca-certificates
  - gnupg
  - lsb-release
  - ufw
  - fail2ban
  - htop
  - nginx
  - tesseract-ocr
  - tesseract-ocr-eng
  - docker.io
  - docker-compose

groups:
  - docker

users:
  - default
  - name: deploy
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ${ssh_public_key}

write_files:
  - path: /etc/systemd/system/prescription-validator.service
    content: |
      [Unit]
      Description=Prescription Validation System
      Requires=docker.service
      After=docker.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      WorkingDirectory=/opt/prescription-validator
      ExecStart=/usr/bin/docker-compose up -d
      ExecStop=/usr/bin/docker-compose down
      TimeoutStartSec=0

      [Install]
      WantedBy=multi-user.target

  - path: /usr/local/bin/backup-prescription-validator.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      BACKUP_DIR="/opt/prescription-validator/backups"
      DATE=$(date +%Y%m%d_%H%M%S)
      mkdir -p $BACKUP_DIR
      
      if [ -f "/opt/prescription-validator/data/production.db" ]; then
          cp /opt/prescription-validator/data/production.db $BACKUP_DIR/production_$DATE.db
      fi
      
      if [ -d "/opt/prescription-validator/uploads" ]; then
          tar -czf $BACKUP_DIR/uploads_$DATE.tar.gz -C /opt/prescription-validator uploads/
      fi
      
      find $BACKUP_DIR -name "*.db" -mtime +7 -delete
      find $BACKUP_DIR -name "*.tar.gz" -mtime +7 -delete

  - path: /usr/local/bin/monitor-prescription-validator.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      CONTAINER_NAME="prescription-validation-system"
      HEALTH_URL="http://localhost/api/health"
      
      if ! docker ps | grep -q $CONTAINER_NAME; then
          echo "$(date): Container $CONTAINER_NAME is not running" >> /var/log/prescription-validator-monitor.log
          systemctl restart prescription-validator.service
      fi
      
      if ! curl -f $HEALTH_URL > /dev/null 2>&1; then
          echo "$(date): Health check failed for $HEALTH_URL" >> /var/log/prescription-validator-monitor.log
          systemctl restart prescription-validator.service
      fi

  - path: /etc/logrotate.d/prescription-validator
    content: |
      /opt/prescription-validator/logs/*.log {
          daily
          rotate 30
          compress
          delaycompress
          missingok
          notifempty
          create 644 deploy deploy
      }

  - path: /opt/prescription-validator/.env.template
    content: |
      FLASK_ENV=${environment}
      SECRET_KEY=your-secret-key-here
      DATABASE_URL=sqlite:///data/production.db
      MAX_CONTENT_LENGTH=16777216
      TESSERACT_CMD=/usr/bin/tesseract
      OCR_LANGUAGE=eng

runcmd:
  # Install Docker Compose
  - curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
  - chmod +x /usr/local/bin/docker-compose

  # Install doctl
  - cd /tmp
  - wget https://github.com/digitalocean/doctl/releases/download/v1.104.0/doctl-1.104.0-linux-amd64.tar.gz
  - tar xf doctl-1.104.0-linux-amd64.tar.gz
  - mv doctl /usr/local/bin
  - chmod +x /usr/local/bin/doctl

  # Create application directories
  - mkdir -p /opt/prescription-validator/{uploads,data,logs,backups}
  - mkdir -p /opt/prescription-validator-staging/{uploads,data,logs,backups}
  - chown -R deploy:deploy /opt/prescription-validator*

  # Configure firewall
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow ssh
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 8080/tcp
  - ufw --force enable

  # Configure fail2ban
  - systemctl enable fail2ban
  - systemctl start fail2ban

  # Enable Docker service
  - systemctl enable docker
  - systemctl start docker

  # Enable prescription validator service
  - systemctl daemon-reload
  - systemctl enable prescription-validator.service

  # Create SSL certificate directory
  - mkdir -p /etc/nginx/ssl
  - openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout /etc/nginx/ssl/key.pem -out /etc/nginx/ssl/cert.pem -subj "/C=US/ST=State/L=City/O=Organization/CN=localhost"
  - chmod 600 /etc/nginx/ssl/key.pem
  - chmod 644 /etc/nginx/ssl/cert.pem

  # Set up cron jobs
  - echo "0 2 * * * /usr/local/bin/backup-prescription-validator.sh" | crontab -u deploy -
  - echo "*/5 * * * * /usr/local/bin/monitor-prescription-validator.sh" | crontab -u deploy -

  # Update system
  - apt-get update
  - apt-get upgrade -y

final_message: |
  The system has been initialized successfully!
  
  Project: ${project_name}
  Environment: ${environment}
  
  Next steps:
  1. Deploy your application code
  2. Configure environment variables
  3. Start the application service
  
  Useful commands:
  - Check status: systemctl status prescription-validator
  - View logs: journalctl -u prescription-validator
  - Manual backup: /usr/local/bin/backup-prescription-validator.sh

