[pytest]
# HealthFlow AI - Pytest Configuration
# Production-ready testing configuration

# Test discovery
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
testpaths = tests

# Output options
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    --showlocals
    # Show summary of all test outcomes
    -ra
    # Coverage reporting
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    # Fail if coverage is below threshold
    --cov-fail-under=80
    # Strict markers
    --strict-markers
    # Show warnings
    -W default
    # Parallel execution (use -n auto for all cores)
    # -n auto
    # Stop on first failure (useful for debugging)
    # -x
    # Show slowest tests
    --durations=10

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, requires services)
    e2e: End-to-end tests (slowest, full system)
    smoke: Smoke tests (critical functionality)
    security: Security tests
    performance: Performance tests
    slow: Slow tests (skip with -m "not slow")
    api: API endpoint tests
    database: Database tests
    auth: Authentication tests
    ocr: OCR service tests
    nlp: NLP service tests
    validation: Validation service tests

# Coverage options
[coverage:run]
source = src
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */env/*
    */migrations/*
    */config/*_test.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod

[coverage:html]
directory = htmlcov

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Timeout for tests (prevent hanging)
timeout = 300
timeout_method = thread

# Warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Minimum Python version
minversion = 3.11

# Test collection
norecursedirs = .git .tox dist build *.egg node_modules venv env

# Console output
console_output_style = progress

# JUnit XML for CI/CD
junit_family = xunit2
junit_suite_name = HealthFlow Test Suite

