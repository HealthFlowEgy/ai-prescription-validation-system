version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: prescription-validator-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prescription_validator}
      POSTGRES_USER: ${POSTGRES_USER:-prescription_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prescription_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prescription-network

  # Redis Cache (Optional)
  redis:
    image: redis:7-alpine
    container_name: prescription-validator-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prescription-network

  # Application
  app:
    build:
      context: .
      dockerfile: Dockerfile.production
      args:
        APP_VERSION: ${APP_VERSION:-2.1.0}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE}
    image: prescription-validator:${APP_VERSION:-latest}
    container_name: prescription-validation-system
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # Flask
      FLASK_ENV: production
      FLASK_APP: src.main_integrated:app
      
      # Security
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-prescription_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-prescription_validator}
      
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      
      # Monitoring
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENVIRONMENT: production
      
      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      
      # Application
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      MAX_REQUESTS_PER_MINUTE: ${MAX_REQUESTS_PER_MINUTE:-60}
      
      # Features
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      ENABLE_METRICS: ${ENABLE_METRICS:-true}
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - prescription-network
    labels:
      - "com.healthflow.service=prescription-validator"
      - "com.healthflow.version=${APP_VERSION:-2.1.0}"

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: prescription-validator-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - prescription-network
    labels:
      - "com.healthflow.service=nginx"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  prescription-network:
    driver: bridge
