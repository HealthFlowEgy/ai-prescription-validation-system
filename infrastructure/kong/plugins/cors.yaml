# Kong CORS Plugin

apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: cors
  namespace: healthflow
spec:
  plugin: cors
  config:
    origins:
    - https://app.healthflow.com
    - https://staging.healthflow.com
    methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
    headers:
    - Accept
    - Authorization
    - Content-Type
    - X-Request-ID
    exposed_headers:
    - X-Request-ID
    - X-RateLimit-Limit
    - X-RateLimit-Remaining
    credentials: true
    max_age: 3600
    preflight_continue: false

