**File:** `scripts/rotate_encryption_keys.py`

```python
#!/usr/bin/env python3
"""
Rotate encryption keys.

This script:
1. Generates a new encryption key
2. Updates environment variables
3. Re-encrypts all data with the new key

Usage:
    python scripts/rotate_encryption_keys.py
"""

import sys
import os
import argparse
import logging

sys.path.insert(0, os.path.abspath(os.path.join(os.path.dirname(__file__), '..')))

from src.encryption.field_encryption import EncryptionKeyManager, init_encryption_service
from src.database import db, init_app
from src.models.prescription import Prescription, User
from flask import Flask
import redis

logging.basicConfig(level=logging.INFO)
logger = logging.getLogger(__name__)


def rotate_keys(batch_size=100):
    """
    Rotate encryption keys by re-encrypting all data.
    
    Steps:
    1. Generate new key
    2. Set as ENCRYPTION_KEY_CURRENT
    3. Move old key to ENCRYPTION_KEY_PREVIOUS_1
    4. Re-encrypt all data with new key
    """
    
    logger.info("Starting key rotation...")
    
    # Generate new key
    new_key = EncryptionKeyManager.generate_key()
    logger.info(f"Generated new encryption key")
    
    # Get current key
    current_key = os.environ.get('ENCRYPTION_KEY_CURRENT')
    
    # Update environment (in production, update secrets manager)
    logger.warning("UPDATE YOUR SECRETS MANAGER WITH THESE VALUES:")
    logger.warning(f"ENCRYPTION_KEY_CURRENT={new_key}")
    logger.warning(f"ENCRYPTION_KEY_PREVIOUS_1={current_key}")
    
    # Wait for confirmation
    response = input("Have you updated the secrets manager? (yes/no): ")
    if response.lower() != 'yes':
        logger.error("Key rotation cancelled")
        return 1
    
    # Re-encrypt all data
    app = Flask(__name__)
    app.config['SQLALCHEMY_DATABASE_URI'] = os.environ.get('DATABASE_URL')
    init_app(app)
    
    redis_client = redis.from_url(os.environ.get('REDIS_URL'))
    encryption_service = init_encryption_service(redis_client)
    
    with app.app_context():
        # Re-encrypt prescriptions
        total_prescriptions = Prescription.query.count()
        logger.info(f"Re-encrypting {total_prescriptions} prescriptions...")
        
        for offset in range(0, total_prescriptions, batch_size):
            batch = Prescription.query.offset(offset).limit(batch_size).all()
            
            for prescription in batch:
                # Re-encrypt each field
                if prescription.patient_name_encrypted:
                    prescription.patient_name_encrypted = encryption_service.rotate_key(
                        prescription.patient_name_encrypted
                    )
                # ... repeat for all encrypted fields
            
            db.session.commit()
            logger.info(f"Re-encrypted prescriptions {offset} to {offset + len(batch)}")
        
        # Re-encrypt users
        total_users = User.query.count()
        logger.info(f"Re-encrypting {total_users} users...")
        
        for offset in range(0, total_users, batch_size):
            batch = User.query.offset(offset).limit(batch_size).all()
            
            for user in batch:
                if user.email_encrypted:
                    user.email_encrypted = encryption_service.rotate_key(user.email_encrypted)
                if user.full_name_encrypted:
                    user.full_name_encrypted = encryption_service.rotate_key(user.full_name_encrypted)
                if user.phone_encrypted:
                    user.phone_encrypted = encryption_service.rotate_key(user.phone_encrypted)
            
            db.session.commit()
            logger.info(f"Re-encrypted users {offset} to {offset + len(batch)}")
    
    logger.info("Key rotation complete!")
    return 0


if __name__ == '__main__':
    sys.exit(rotate_keys())
