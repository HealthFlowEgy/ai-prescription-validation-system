### Artifact 5: Data Migration Script

**File:** `scripts/migrate_to_encrypted_fields.py`

```python
#!/usr/bin/env python3
"""
Migrate existing plaintext data to encrypted fields.

This script:
1. Reads existing data from old columns
2. Encrypts it using the encryption service
3. Writes to new encrypted columns
4. Verifies data integrity

Usage:
    python scripts/migrate_to_encrypted_fields.py --batch-size 100

Options:
    --batch-size: Number of records to process at once (default: 100)
    --dry-run: Don't actually write encrypted data
    --verify: Verify encryption by decrypting and comparing
"""

import sys
import os
import argparse
import logging
from typing import List

# Add project root to path
sys.path.insert(0, os.path.abspath(os.path.join(os.path.dirname(__file__), '..')))

from src.database import db, init_app
from src.models.prescription import Prescription, User
from src.encryption.field_encryption import init_encryption_service, get_encryption_service
from flask import Flask
import redis
from datetime import date

logging.basicConfig(
    level=logging.INFO,
    format='%(asctime)s - %(levelname)s - %(message)s'
)
logger = logging.getLogger(__name__)


class DataMigrator:
    """Migrates plaintext data to encrypted fields."""
    
    def __init__(self, batch_size=100, dry_run=False, verify=False):
        self.batch_size = batch_size
        self.dry_run = dry_run
        self.verify = verify
        self.encryption_service = get_encryption_service()
        
        self.stats = {
            'prescriptions_processed': 0,
            'prescriptions_failed': 0,
            'users_processed': 0,
            'users_failed': 0,
            'verification_errors': 0
        }
    
    def migrate_prescriptions(self):
        """Migrate prescription records."""
        logger.info("Starting prescription migration...")
        
        # Get total count
        total = db.session.query(Prescription).count()
        logger.info(f"Found {total} prescriptions to migrate")
        
        offset = 0
        while offset < total:
            # Process in batches
            batch = db.session.query(Prescription).offset(offset).limit(self.batch_size).all()
            
            if not batch:
                break
            
            logger.info(f"Processing prescriptions {offset + 1} to {offset + len(batch)}")
            
            for prescription in batch:
                try:
                    self._migrate_prescription(prescription)
                    self.stats['prescriptions_processed'] += 1
                except Exception as e:
                    logger.error(f"Failed to migrate prescription {prescription.id}: {e}")
                    self.stats['prescriptions_failed'] += 1
            
            if not self.dry_run:
                db.session.commit()
                logger.info(f"Committed batch of {len(batch)} prescriptions")
            
            offset += self.batch_size
        
        logger.info(f"Prescription migration complete: "
                   f"{self.stats['prescriptions_processed']} processed, "
                   f"{self.stats['prescriptions_failed']} failed")
    
    def _migrate_prescription(self, prescription: Prescription):
        """Migrate a single prescription record."""
        
        # Encrypt each PHI field
        if hasattr(prescription, 'patient_name') and prescription.patient_name:
            encrypted = self.encryption_service.encrypt(prescription.patient_name)
            if self.verify:
                self._verify_encryption(prescription.patient_name, encrypted)
            prescription.patient_name_encrypted = encrypted
        
        if hasattr(prescription, 'patient_dob') and prescription.patient_dob:
            # Convert date to ISO string before encryption
            dob_str = prescription.patient_dob.isoformat() if isinstance(prescription.patient_dob, date) else str(prescription.patient_dob)
            encrypted = self.encryption_service.encrypt(dob_str)
            if self.verify:
                self._verify_encryption(dob_str, encrypted)
            prescription.patient_dob_encrypted = encrypted
        
        if hasattr(prescription, 'patient_contact') and prescription.patient_contact:
            encrypted = self.encryption_service.encrypt(prescription.patient_contact)
            if self.verify:
                self._verify_encryption(prescription.patient_contact, encrypted)
            prescription.patient_contact_encrypted = encrypted
        
        if hasattr(prescription, 'patient_address') and prescription.patient_address:
            encrypted = self.encryption_service.encrypt(prescription.patient_address)
            if self.verify:
                self._verify_encryption(prescription.patient_address, encrypted)
            prescription.patient_address_encrypted = encrypted
        
        if hasattr(prescription, 'diagnosis') and prescription.diagnosis:
            encrypted = self.encryption_service.encrypt(prescription.diagnosis)
            if self.verify:
                self._verify_encryption(prescription.diagnosis, encrypted)
            prescription.diagnosis_encrypted = encrypted
        
        if hasattr(prescription, 'doctor_name') and prescription.doctor_name:
            encrypted = self.encryption_service.encrypt(prescription.doctor_name)
            if self.verify:
                self._verify_encryption(prescription.doctor_name, encrypted)
            prescription.doctor_name_encrypted = encrypted
        
        if hasattr(prescription, 'doctor_notes') and prescription.doctor_notes:
            encrypted = self.encryption_service.encrypt(prescription.doctor_notes)
            if self.verify:
                self._verify_encryption(prescription.doctor_notes, encrypted)
            prescription.doctor_notes_encrypted = encrypted
        
        logger.debug(f"Migrated prescription {prescription.id}")
    
    def migrate_users(self):
        """Migrate user records."""
        logger.info("Starting user migration...")
        
        total = db.session.query(User).count()
        logger.info(f"Found {total} users to migrate")
        
        offset = 0
        while offset < total:
            batch = db.session.query(User).offset(offset).limit(self.batch_size).all()
            
            if not batch:
                break
            
            logger.info(f"Processing users {offset + 1} to {offset + len(batch)}")
            
            for user in batch:
                try:
                    self._migrate_user(user)
                    self.stats['users_processed'] += 1
                except Exception as e:
                    logger.error(f"Failed to migrate user {user.id}: {e}")
                    self.stats['users_failed'] += 1
            
            if not self.dry_run:
                db.session.commit()
                logger.info(f"Committed batch of {len(batch)} users")
            
            offset += self.batch_size
        
        logger.info(f"User migration complete: "
                   f"{self.stats['users_processed']} processed, "
                   f"{self.stats['users_failed']} failed")
    
    def _migrate_user(self, user: User):
        """Migrate a single user record."""
        
        if hasattr(user, 'email') and user.email:
            encrypted = self.encryption_service.encrypt(user.email)
            if self.verify:
                self._verify_encryption(user.email, encrypted)
            user.email_encrypted = encrypted
        
        if hasattr(user, 'full_name') and user.full_name:
            encrypted = self.encryption_service.encrypt(user.full_name)
            if self.verify:
                self._verify_encryption(user.full_name, encrypted)
            user.full_name_encrypted = encrypted
        
        if hasattr(user, 'phone') and user.phone:
            encrypted = self.encryption_service.encrypt(user.phone)
            if self.verify:
                self._verify_encryption(user.phone, encrypted)
            user.phone_encrypted = encrypted
        
        logger.debug(f"Migrated user {user.id}")
    
    def _verify_encryption(self, original: str, encrypted: str):
        """Verify encryption by decrypting and comparing."""
        try:
            decrypted = self.encryption_service.decrypt(encrypted)
            if decrypted != original:
                logger.error(f"Verification failed: decrypted value doesn't match original")
                self.stats['verification_errors'] += 1
        except Exception as e:
            logger.error(f"Verification failed: {e}")
            self.stats['verification_errors'] += 1
    
    def print_stats(self):
        """Print migration statistics."""
        logger.info("=" * 60)
        logger.info("MIGRATION STATISTICS")
        logger.info("=" * 60)
        logger.info(f"Prescriptions processed: {self.stats['prescriptions_processed']}")
        logger.info(f"Prescriptions failed: {self.stats['prescriptions_failed']}")
        logger.info(f"Users processed: {self.stats['users_processed']}")
        logger.info(f"Users failed: {self.stats['users_failed']}")
        if self.verify:
            logger.info(f"Verification errors: {self.stats['verification_errors']}")
        logger.info("=" * 60)


def main():
    parser = argparse.ArgumentParser(description='Migrate data to encrypted fields')
    parser.add_argument('--batch-size', type=int, default=100,
                       help='Number of records to process at once')
    parser.add_argument('--dry-run', action='store_true',
                       help="Don't actually write encrypted data")
    parser.add_argument('--verify', action='store_true',
                       help='Verify encryption by decrypting and comparing')
    
    args = parser.parse_args()
    
    if args.dry_run:
        logger.warning("DRY RUN MODE - No data will be written")
    
    # Initialize Flask app
    app = Flask(__name__)
    app.config['SQLALCHEMY_DATABASE_URI'] = os.environ.get('DATABASE_URL')
    app.config['SQLALCHEMY_TRACK_MODIFICATIONS'] = False
    
    init_app(app)
    
    # Initialize encryption service
    redis_client = redis.from_url(os.environ.get('REDIS_URL', 'redis://localhost:6379/0'))
    init_encryption_service(redis_client)
    
    with app.app_context():
        migrator = DataMigrator(
            batch_size=args.batch_size,
            dry_run=args.dry_run,
            verify=args.verify
        )
        
        # Run migrations
        migrator.migrate_prescriptions()
        migrator.migrate_users()
        
        # Print stats
        migrator.print_stats()
        
        if migrator.stats['prescriptions_failed'] > 0 or migrator.stats['users_failed'] > 0:
            logger.error("Migration completed with errors!")
            return 1
        
        if args.verify and migrator.stats['verification_errors'] > 0:
            logger.error("Verification failed!")
            return 1
        
        logger.info("Migration completed successfully!")
        return 0


if __name__ == '__main__':
    sys.exit(main())
