### Artifact 2: Encrypted Database Column Type

**File:** `src/encryption/encrypted_types.py`

```python
"""
SQLAlchemy custom types for encrypted columns.
Transparently encrypts/decrypts data on read/write.
"""

from sqlalchemy.types import TypeDecorator, String, Text, Date
from datetime import date
from typing import Optional
from .field_encryption import get_encryption_service


class EncryptedString(TypeDecorator):
    """
    Encrypted string column type.
    Usage: patient_name = Column(EncryptedString(255))
    """
    
    impl = String
    cache_ok = True
    
    def __init__(self, length=None, **kwargs):
        # Encrypted data is base64-encoded, so needs ~33% more space
        encrypted_length = int(length * 1.4) if length else None
        super().__init__(encrypted_length, **kwargs)
        self.original_length = length
    
    def process_bind_param(self, value: Optional[str], dialect) -> Optional[str]:
        """Encrypt value before storing in database."""
        if value is None:
            return None
        
        # Validate length before encryption
        if self.original_length and len(value) > self.original_length:
            raise ValueError(f"Value exceeds maximum length of {self.original_length}")
        
        encryption_service = get_encryption_service()
        return encryption_service.encrypt(value)
    
    def process_result_value(self, value: Optional[str], dialect) -> Optional[str]:
        """Decrypt value when reading from database."""
        if value is None:
            return None
        
        encryption_service = get_encryption_service()
        return encryption_service.decrypt(value)


class EncryptedText(TypeDecorator):
    """
    Encrypted text column type (for longer strings).
    Usage: diagnosis = Column(EncryptedText)
    """
    
    impl = Text
    cache_ok = True
    
    def process_bind_param(self, value: Optional[str], dialect) -> Optional[str]:
        """Encrypt value before storing in database."""
        if value is None:
            return None
        
        encryption_service = get_encryption_service()
        return encryption_service.encrypt(value)
    
    def process_result_value(self, value: Optional[str], dialect) -> Optional[str]:
        """Decrypt value when reading from database."""
        if value is None:
            return None
        
        encryption_service = get_encryption_service()
        return encryption_service.decrypt(value)


class EncryptedDate(TypeDecorator):
    """
    Encrypted date column type.
    Stores dates as encrypted ISO format strings.
    Usage: patient_dob = Column(EncryptedDate)
    """
    
    impl = String(200)  # Encrypted ISO date string
    cache_ok = True
    
    def process_bind_param(self, value: Optional[date], dialect) -> Optional[str]:
        """Encrypt date before storing in database."""
        if value is None:
            return None
        
        # Convert date to ISO string
        if isinstance(value, date):
            date_str = value.isoformat()
        else:
            date_str = str(value)
        
        encryption_service = get_encryption_service()
        return encryption_service.encrypt(date_str)
    
    def process_result_value(self, value: Optional[str], dialect) -> Optional[date]:
        """Decrypt and parse date when reading from database."""
        if value is None:
            return None
        
        encryption_service = get_encryption_service()
        date_str = encryption_service.decrypt(value)
        
        # Parse ISO string back to date
        return date.fromisoformat(date_str)


class EncryptedJSON(TypeDecorator):
    """
    Encrypted JSON column type.
    Usage: metadata = Column(EncryptedJSON)
    """
    
    impl = Text
    cache_ok = True
    
    def process_bind_param(self, value, dialect) -> Optional[str]:
        """Encrypt JSON before storing in database."""
        if value is None:
            return None
        
        import json
        json_str = json.dumps(value)
        
        encryption_service = get_encryption_service()
        return encryption_service.encrypt(json_str)
    
    def process_result_value(self, value: Optional[str], dialect):
        """Decrypt and parse JSON when reading from database."""
        if value is None:
            return None
        
        import json
        encryption_service = get_encryption_service()
        json_str = encryption_service.decrypt(value)
        
        return json.loads(json_str)
