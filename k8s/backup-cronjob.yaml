"""
Prescription model with encrypted PHI fields.
"""

from datetime import datetime
from sqlalchemy.dialects.postgresql import UUID, ARRAY
from src.database import db
from src.encryption.encrypted_types import (
    EncryptedString, 
    EncryptedText, 
    EncryptedDate,
    EncryptedJSON
)
import uuid


class Prescription(db.Model):
    """
    Prescription model with field-level encryption for PHI.
    
    Encrypted Fields (PHI):
    - patient_name
    - patient_dob
    - patient_contact
    - patient_address
    - diagnosis
    - doctor_notes
    - pharmacy_notes
    """
    
    __tablename__ = 'prescriptions'
    
    # Primary key
    id = db.Column(UUID(as_uuid=True), primary_key=True, default=uuid.uuid4)
    
    # Non-PHI metadata (not encrypted)
    user_id = db.Column(UUID(as_uuid=True), db.ForeignKey('users.id'), nullable=False)
    status = db.Column(db.String(50), nullable=False, default='PENDING', index=True)
    uploaded_at = db.Column(db.DateTime, nullable=False, default=datetime.utcnow, index=True)
    processing_started_at = db.Column(db.DateTime)
    processing_completed_at = db.Column(db.DateTime)
    
    # File references (not encrypted - just paths/IDs)
    image_path = db.Column(db.String(500))
    celery_task_id = db.Column(db.String(255))
    
    # ===== ENCRYPTED PHI FIELDS =====
    
    # Patient information (ENCRYPTED)
    patient_name = db.Column(EncryptedString(255))
    patient_dob = db.Column(EncryptedDate)
    patient_contact = db.Column(EncryptedString(100))  # Phone/email
    patient_address = db.Column(EncryptedText)
    patient_id_number = db.Column(EncryptedString(100))  # National ID, SSN, etc.
    
    # Medical information (ENCRYPTED)
    diagnosis = db.Column(EncryptedText)
    medical_history = db.Column(EncryptedJSON)  # Stored as encrypted JSON
    allergies = db.Column(EncryptedText)
    
    # Prescription details (ENCRYPTED)
    doctor_name = db.Column(EncryptedString(255))
    doctor_license = db.Column(EncryptedString(100))
    doctor_notes = db.Column(EncryptedText)
    
    # Medications (partially encrypted)
    # Medication names are NOT encrypted (needed for drug interaction queries)
    # But dosage and instructions ARE encrypted
    medications = db.Column(ARRAY(db.String))  # Not encrypted - for queries
    medication_details = db.Column(EncryptedJSON)  # Encrypted - full details
    
    # Pharmacy information (ENCRYPTED)
    pharmacy_name = db.Column(EncryptedString(255))
    pharmacy_notes = db.Column(EncryptedText)
    
    # ===== END ENCRYPTED FIELDS =====
    
    # OCR/NLP results (not encrypted - derived data)
    ocr_text = db.Column(db.Text)
    ocr_confidence = db.Column(db.Float)
    
    # Validation results (not encrypted)
    validation_flags = db.Column(db.JSON)
    validation_status = db.Column(db.String(50))
    
    # Timestamps
    created_at = db.Column(db.DateTime, default=datetime.utcnow, nullable=False)
    updated_at = db.Column(db.DateTime, default=datetime.utcnow, onupdate=datetime.utcnow)
    
    # Relationships
    user = db.relationship('User', backref='prescriptions')
    audit_logs = db.relationship('AuditLog', backref='prescription', lazy='dynamic')
    
    def to_dict(self, include_phi=False):
        """
        Convert to dictionary.
        By default, excludes encrypted PHI fields.
        Set include_phi=True to include decrypted PHI (logs audit).
        """
        data = {
            'id': str(self.id),
            'status': self.status,
            'uploaded_at': self.uploaded_at.isoformat() if self.uploaded_at else None,
            'ocr_confidence': self.ocr_confidence,
            'validation_status': self.validation_status,
        }
        
        if include_phi:
            # These fields are automatically decrypted by SQLAlchemy
            data.update({
                'patient_name': self.patient_name,
                'patient_dob': self.patient_dob.isoformat() if self.patient_dob else None,
                'diagnosis': self.diagnosis,
                'medications': self.medications,
                'medication_details': self.medication_details,
                'doctor_name': self.doctor_name,
            })
            
            # Log PHI access
            from src.models.audit_log import AuditLog
            AuditLog.log_phi_access(
                user_id=self.user_id,
                prescription_id=self.id,
                fields_accessed=['patient_name', 'patient_dob', 'diagnosis', 'medications']
            )
        
        return data
    
    def __repr__(self):
        # Never include PHI in repr
        return f'<Prescription {self.id} status={self.status}>'


class User(db.Model):
    """User model with encrypted PII."""
    
    __tablename__ = 'users'
    
    id = db.Column(UUID(as_uuid=True), primary_key=True, default=uuid.uuid4)
    
    # Encrypted PII
    email = db.Column(EncryptedString(255), unique=True, nullable=False)
    full_name = db.Column(EncryptedString(255))
    phone = db.Column(EncryptedString(50))
    
    # Non-encrypted fields
    role = db.Column(db.String(50), nullable=False, default='DOCTOR')
    is_active = db.Column(db.Boolean, default=True)
    password_hash = db.Column(db.String(255), nullable=False)
    
    created_at = db.Column(db.DateTime, default=datetime.utcnow)
    last_login = db.Column(db.DateTime)
    
    def __repr__(self):
        return f'<User {self.id} role={self.role}>'
