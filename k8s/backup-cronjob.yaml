**File:** `src/encryption/field_encryption.py`

```python
"""
Field-level encryption service for PHI data.
Uses Fernet (symmetric encryption) with key rotation support.
"""

import os
import base64
from typing import Optional, Dict
from datetime import datetime, timedelta
from cryptography.fernet import Fernet, MultiFernet
from cryptography.hazmat.primitives import hashes
from cryptography.hazmat.primitives.kdf.pbkdf2 import PBKDF2
from cryptography.hazmat.backends import default_backend
import redis
import logging

logger = logging.getLogger(__name__)


class EncryptionKeyManager:
    """
    Manages encryption keys with rotation support.
    Keys are stored in environment variables and cached in Redis.
    """
    
    def __init__(self, redis_client: redis.Redis):
        self.redis_client = redis_client
        self.key_prefix = "encryption_key"
        self.key_ttl = 86400  # 24 hours
        
    def get_current_key(self) -> bytes:
        """Get the current active encryption key."""
        # Try Redis cache first
        cached_key = self.redis_client.get(f"{self.key_prefix}:current")
        if cached_key:
            return base64.b64decode(cached_key)
        
        # Get from environment
        key_str = os.environ.get('ENCRYPTION_KEY_CURRENT')
        if not key_str:
            raise ValueError("ENCRYPTION_KEY_CURRENT not set in environment")
        
        key = base64.b64decode(key_str.encode())
        
        # Cache in Redis
        self.redis_client.setex(
            f"{self.key_prefix}:current",
            self.key_ttl,
            base64.b64encode(key)
        )
        
        return key
    
    def get_previous_keys(self) -> list[bytes]:
        """
        Get previous keys for decryption of old data.
        Supports key rotation without data re-encryption.
        """
        keys = []
        
        # Get up to 3 previous keys
        for i in range(1, 4):
            key_name = f'ENCRYPTION_KEY_PREVIOUS_{i}'
            key_str = os.environ.get(key_name)
            if key_str:
                keys.append(base64.b64decode(key_str.encode()))
        
        return keys
    
    def get_multi_fernet(self) -> MultiFernet:
        """
        Get MultiFernet instance with current and previous keys.
        MultiFernet tries each key in order for decryption.
        """
        current_key = self.get_current_key()
        previous_keys = self.get_previous_keys()
        
        all_keys = [Fernet(current_key)]
        all_keys.extend([Fernet(key) for key in previous_keys])
        
        return MultiFernet(all_keys)
    
    @staticmethod
    def generate_key() -> str:
        """Generate a new Fernet key (for key rotation)."""
        key = Fernet.generate_key()
        return base64.b64encode(key).decode('utf-8')
    
    @staticmethod
    def derive_key_from_password(password: str, salt: bytes) -> bytes:
        """
        Derive encryption key from password using PBKDF2.
        Used for password-based encryption scenarios.
        """
        kdf = PBKDF2(
            algorithm=hashes.SHA256(),
            length=32,
            salt=salt,
            iterations=100000,
            backend=default_backend()
        )
        return base64.urlsafe_b64encode(kdf.derive(password.encode()))


class FieldEncryptionService:
    """
    Service for encrypting and decrypting individual database fields.
    Supports key rotation and performance optimization via caching.
    """
    
    def __init__(self, key_manager: EncryptionKeyManager):
        self.key_manager = key_manager
        self.fernet = key_manager.get_multi_fernet()
        self._cache: Dict[str, str] = {}
        self._cache_enabled = True
        self._cache_ttl = 300  # 5 minutes
        
    def encrypt(self, plaintext: Optional[str]) -> Optional[str]:
        """
        Encrypt a plaintext string.
        Returns base64-encoded ciphertext.
        """
        if plaintext is None:
            return None
        
        if not isinstance(plaintext, str):
            plaintext = str(plaintext)
        
        try:
            # Encrypt using current key
            ciphertext = self.fernet.encrypt(plaintext.encode())
            
            # Return as string for database storage
            return ciphertext.decode('utf-8')
            
        except Exception as e:
            logger.error(f"Encryption failed: {e}")
            raise EncryptionError(f"Failed to encrypt data: {e}")
    
    def decrypt(self, ciphertext: Optional[str]) -> Optional[str]:
        """
        Decrypt a ciphertext string.
        Automatically tries current and previous keys.
        """
        if ciphertext is None:
            return None
        
        # Check cache first
        if self._cache_enabled and ciphertext in self._cache:
            return self._cache[ciphertext]
        
        try:
            # MultiFernet will try all keys automatically
            plaintext = self.fernet.decrypt(ciphertext.encode())
            result = plaintext.decode('utf-8')
            
            # Cache the result
            if self._cache_enabled:
                self._cache[ciphertext] = result
            
            return result
            
        except Exception as e:
            logger.error(f"Decryption failed: {e}")
            raise DecryptionError(f"Failed to decrypt data: {e}")
    
    def bulk_encrypt(self, data_dict: Dict[str, Optional[str]]) -> Dict[str, Optional[str]]:
        """Encrypt multiple fields at once (performance optimization)."""
        return {
            key: self.encrypt(value)
            for key, value in data_dict.items()
        }
    
    def bulk_decrypt(self, data_dict: Dict[str, Optional[str]]) -> Dict[str, Optional[str]]:
        """Decrypt multiple fields at once (performance optimization)."""
        return {
            key: self.decrypt(value)
            for key, value in data_dict.items()
        }
    
    def rotate_key(self, old_ciphertext: str) -> str:
        """
        Re-encrypt data with current key (for key rotation).
        Decrypts with old key, encrypts with current key.
        """
        plaintext = self.decrypt(old_ciphertext)
        return self.encrypt(plaintext)
    
    def clear_cache(self):
        """Clear decryption cache."""
        self._cache.clear()


class EncryptionError(Exception):
    """Raised when encryption fails."""
    pass


class DecryptionError(Exception):
    """Raised when decryption fails."""
    pass


# Singleton instances
_key_manager: Optional[EncryptionKeyManager] = None
_encryption_service: Optional[FieldEncryptionService] = None


def init_encryption_service(redis_client: redis.Redis) -> FieldEncryptionService:
    """Initialize the encryption service (call once at app startup)."""
    global _key_manager, _encryption_service
    
    _key_manager = EncryptionKeyManager(redis_client)
    _encryption_service = FieldEncryptionService(_key_manager)
    
    logger.info("Encryption service initialized")
    return _encryption_service


def get_encryption_service() -> FieldEncryptionService:
    """Get the encryption service instance."""
    if _encryption_service is None:
        raise RuntimeError("Encryption service not initialized. Call init_encryption_service() first.")
    return _encryption_service
