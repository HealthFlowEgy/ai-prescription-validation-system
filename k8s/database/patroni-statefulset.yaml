### Priority 2: Distributed Tracing (15 points)

#### US-2.4: OpenTelemetry Implementation
**Story Points:** 8  
**Priority:** 🟡 HIGH  
**Owner:** Backend Team + DevOps

**User Story:**  
As a developer, I need distributed tracing across all services so that I can debug performance issues and understand request flow through the system.

**Acceptance Criteria:**
- [ ] OpenTelemetry SDK integrated in Flask app
- [ ] Automatic instrumentation for Flask, SQLAlchemy, Redis, Celery
- [ ] Custom spans for business logic
- [ ] Trace context propagation across services
- [ ] Jaeger backend deployed
- [ ] Traces viewable in Jaeger UI

**Technical Implementation:**

```python
# src/tracing/opentelemetry_config.py
"""
OpenTelemetry configuration for distributed tracing.
"""

import os
from opentelemetry import trace
from opentelemetry.exporter.otlp.proto.grpc.trace_exporter import OTLPSpanExporter
from opentelemetry.sdk.trace import TracerProvider
from opentelemetry.sdk.trace.export import BatchSpanProcessor
from opentelemetry.sdk.resources import Resource, SERVICE_NAME, SERVICE_VERSION
from opentelemetry.instrumentation.flask import FlaskInstrumentor
from opentelemetry.instrumentation.sqlalchemy import SQLAlchemyInstrumentor
from opentelemetry.instrumentation.redis import RedisInstrumentor
from opentelemetry.instrumentation.celery import CeleryInstrumentor
from opentelemetry.instrumentation.requests import RequestsInstrumentor
import logging

logger = logging.getLogger(__name__)


def init_tracer(app):
    """
    Initialize OpenTelemetry tracing for the Flask application.
    
    Args:
        app: Flask application instance
    """
    
    # Create resource with service information
    resource = Resource(attributes={
        SERVICE_NAME: os.getenv('SERVICE_NAME', 'healthflow-backend'),
        SERVICE_VERSION: os.getenv('SERVICE_VERSION', '1.0.0'),
        "environment": os.getenv('ENVIRONMENT', 'production'),
        "deployment.namespace": os.getenv('NAMESPACE', 'healthflow-production')
    })
    
    # Create tracer provider
    provider = TracerProvider(resource=resource)
    
    # Configure OTLP exporter (sends to Jaeger/Tempo)
    otlp_exporter = OTLPSpanExporter(
        endpoint=os.getenv('OTEL_EXPORTER_OTLP_ENDPOINT', 'jaeger:4317'),
        insecure=True  # Use TLS in production
    )
    
    # Add span processor
    provider.add_span_processor(BatchSpanProcessor(otlp_exporter))
    
    # Set global tracer provider
    trace.set_tracer_provider(provider)
    
    # Auto-instrument Flask
    FlaskInstrumentor().instrument_app(app)
    
    # Auto-instrument SQLAlchemy
    from src.database import db
    SQLAlchemyInstrumentor().instrument(
        engine=db.engine,
        service="healthflow-postgres"
    )
    
    # Auto-instrument Redis
    import redis
    RedisInstrumentor().instrument()
    
    # Auto-instrument Celery
    CeleryInstrumentor().instrument()
    
    # Auto-instrument requests library
    RequestsInstrumentor().instrument()
    
    logger.info(f"OpenTelemetry tracing initialized for {resource.attributes[SERVICE_NAME]}")
    
    return trace.get_tracer(__name__)


# Custom tracing decorators
def trace_function(span_name=None):
    """
    Decorator to trace a function with a custom span.
    
    Usage:
        @trace_function("process_prescription")
        def process_prescription(prescription_id):
            ...
    """
    def decorator(func):
        from functools import wraps
        
        @wraps(func)
        def wrapper(*args, **kwargs):
            tracer = trace.get_tracer(__name__)
            name = span_name or func.__name__
            
            with tracer.start_as_current_span(name) as span:
                # Add function metadata
                span.set_attribute("function.name", func.__name__)
                span.set_attribute("function.module", func.__module__)
                
                try:
                    result = func(*args, **kwargs)
                    span.set_attribute("function.result", "success")
                    return result
                except Exception as e:
                    span.set_attribute("function.result", "error")
                    span.set_attribute("error.type", type(e).__name__)
                    span.set_attribute("error.message", str(e))
                    span.record_exception(e)
                    raise
        
        return wrapper
    return decorator


def add_span_attributes(**attributes):
    """
    Add custom attributes to the current span.
    
    Usage:
        add_span_attributes(
            prescription_id="123",
            patient_type="new",
            ocr_confidence=0.95
        )
    """
    span = trace.get_current_span()
    if span:
        for key, value in attributes.items():
            span.set_attribute(key, value)


def add_span_event(name, **attributes):
    """
    Add an event to the current span.
    
    Usage:
        add_span_event("prescription_validated", confidence=0.95)
    """
    span = trace.get_current_span()
    if span:
        span.add_event(name, attributes=attributes)
```

**Usage Example:**

```python
# src/api/prescriptions.py
from src.tracing.opentelemetry_config import trace_function, add_span_attributes, add_span_event
from opentelemetry import trace

tracer = trace.get_tracer(__name__)

@app.route('/api/prescriptions/<prescription_id>/process', methods=['POST'])
@trace_function("process_prescription_api")
def process_prescription(prescription_id):
    # Current span is automatically created by Flask instrumentation
    # Add custom attributes
    add_span_attributes(
        prescription_id=prescription_id,
        user_id=g.current_user.id
    )
    
    # Create custom child span for OCR
    with tracer.start_as_current_span("ocr_extraction") as ocr_span:
        ocr_result = ocr_service.extract_text(prescription.image_path)
        ocr_span.set_attribute("ocr.confidence", ocr_result.confidence)
        ocr_span.set_attribute("ocr.text_length", len(ocr_result.text))
        
        if ocr_result.confidence < 0.85:
            add_span_event("low_confidence_detected", confidence=ocr_result.confidence)
    
    # Create custom child span for NLP
    with tracer.start_as_current_span("nlp_extraction") as nlp_span:
        nlp_result = nlp_service.extract_entities(ocr_result.text)
        nlp_span.set_attribute("nlp.medications_found", len(nlp_result.medications))
    
    # Create custom child span for validation
    with tracer.start_as_current_span("validation") as validation_span:
        validation_result = validation_service.validate(prescription, ocr_result, nlp_result)
        validation_span.set_attribute("validation.requires_review", validation_result['requires_review'])
        validation_span.set_attribute("validation.flags_count", len(validation_result['flags']))
    
    return jsonify(validation_result)
