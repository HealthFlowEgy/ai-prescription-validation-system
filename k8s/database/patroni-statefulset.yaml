## 📋 Sprint Backlog

### Priority 1: PostgreSQL High Availability (20 points)

#### US-2.1: PostgreSQL Streaming Replication Setup
**Story Points:** 8  
**Priority:** 🔴 CRITICAL  
**Owner:** DevOps Team + Backend Lead

**User Story:**  
As a DevOps engineer, I need PostgreSQL configured in primary-replica mode with streaming replication so that we have zero data loss and can survive database server failures.

**Acceptance Criteria:**
- [ ] Primary PostgreSQL instance configured
- [ ] 2 replica instances with streaming replication
- [ ] Replication lag < 1 second
- [ ] Replicas readable for reporting queries
- [ ] Replication monitoring in place
- [ ] Documentation for replica promotion

**Technical Implementation:**

```yaml
# kubernetes/postgres-statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: healthflow-production
spec:
  serviceName: postgres
  replicas: 3  # 1 primary + 2 replicas
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: password
        - name: POSTGRES_DB
          value: healthflow
        - name: POSTGRES_INITDB_ARGS
          value: "--data-checksums"
        
        # Replication configuration
        - name: POSTGRES_REPLICA_MODE
          value: "replica"
        - name: POSTGRES_PRIMARY_HOST
          value: "postgres-0.postgres.healthflow-production.svc.cluster.local"
        - name: POSTGRES_REPLICATION_USER
          value: "replicator"
        - name: POSTGRES_REPLICATION_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: replication-password
        
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: postgres-config
          mountPath: /etc/postgresql
        
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U $POSTGRES_USER
          initialDelaySeconds: 30
          periodSeconds: 10
        
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U $POSTGRES_USER
          initialDelaySeconds: 5
          periodSeconds: 5
        
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
      
      volumes:
      - name: postgres-config
        configMap:
          name: postgres-config
  
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 100Gi

---
# PostgreSQL Primary Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: healthflow-production
data:
  postgresql.conf: |
    # Replication Configuration
    wal_level = replica
    max_wal_senders = 10
    max_replication_slots = 10
    hot_standby = on
    hot_standby_feedback = on
    
    # Performance Tuning
    shared_buffers = 1GB
    effective_cache_size = 3GB
    maintenance_work_mem = 256MB
    work_mem = 64MB
    
    # Checkpoint Configuration
    checkpoint_completion_target = 0.9
    wal_buffers = 16MB
    min_wal_size = 1GB
    max_wal_size = 4GB
    
    # Logging
    log_destination = 'stderr'
    logging_collector = on
    log_directory = '/var/log/postgresql'
    log_filename = 'postgresql-%Y-%m-%d.log'
    log_rotation_age = 1d
    log_rotation_size = 100MB
    log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
    log_timezone = 'UTC'
    
    # Connection Settings
    max_connections = 200
    
    # Query Performance
    random_page_cost = 1.1  # For SSD
    effective_io_concurrency = 200
    
  pg_hba.conf: |
    # TYPE  DATABASE        USER            ADDRESS                 METHOD
    local   all             all                                     trust
    host    all             all             127.0.0.1/32            md5
    host    all             all             ::1/128                 md5
    host    all             all             10.0.0.0/8              md5
    host    replication     replicator      10.0.0.0/8              md5

