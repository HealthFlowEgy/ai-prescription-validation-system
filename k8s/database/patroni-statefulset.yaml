#### US-2.2: Patroni for Automated Failover
**Story Points:** 8  
**Priority:** 🔴 CRITICAL  
**Owner:** DevOps Team

**User Story:**  
As a DevOps engineer, I need automated failover when the primary database fails so that the system remains available without manual intervention.

**Acceptance Criteria:**
- [ ] Patroni deployed on all PostgreSQL nodes
- [ ] etcd cluster for distributed consensus
- [ ] Automatic failover < 30 seconds
- [ ] Health checks every 5 seconds
- [ ] Failover tested and verified
- [ ] Monitoring dashboard for cluster status

**Technical Implementation:**

```yaml
# kubernetes/patroni-statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: patroni
  namespace: healthflow-production
spec:
  serviceName: patroni
  replicas: 3
  selector:
