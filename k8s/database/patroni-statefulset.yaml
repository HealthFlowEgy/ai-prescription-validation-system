---
# Patroni Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: patroni-config
  namespace: healthflow-production
data:
  patroni.yml: |
    scope: healthflow
    namespace: /healthflow/
    name: ${PATRONI_NAME}
    
    restapi:
      listen: 0.0.0.0:8008
      connect_address: ${PATRONI_KUBERNETES_POD_IP}:8008
    
    kubernetes:
      namespace: healthflow-production
      labels:
        app: patroni
      use_endpoints: true
    
    bootstrap:
      dcs:
        ttl: 30
        loop_wait: 10
        retry_timeout: 10
        maximum_lag_on_failover: 1048576
        postgresql:
          use_pg_rewind: true
          use_slots: true
          parameters:
            wal_level: replica
            hot_standby: "on"
            max_connections: 200
            max_wal_senders: 10
            max_replication_slots: 10
            max_worker_processes: 8
            wal_keep_size: 128MB
            shared_buffers: 1GB
            effective_cache_size: 3GB
      
      initdb:
        - encoding: UTF8
        - data-checksums
      
      pg_hba:
        - host replication replicator 0.0.0.0/0 md5
        - host all all 0.0.0.0/0 md5
    
    postgresql:
      listen: 0.0.0.0:5432
      connect_address: ${PATRONI_KUBERNETES_POD_IP}:5432
      data_dir: /var/lib/postgresql/data/pgdata
      pgpass: /tmp/pgpass
      authentication:
        replication:
          username: replicator
          password: ${PATRONI_REPLICATION_PASSWORD}
        superuser:
          username: postgres
          password: ${PATRONI_SUPERUSER_PASSWORD}
      parameters:
        unix_socket_directories: '/var/run/postgresql'
      
      create_replica_methods:
        - basebackup
      
      basebackup:
        max-rate: '100M'
        checkpoint: 'fast'
    
    tags:
      nofailover: false
      noloadbalance: false
      clonefrom: false
      nosync: false

